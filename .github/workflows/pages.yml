name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 公開の前の検査。1つでも失敗したら、この先(build・公開)へ進まない。
      - name: 型の検査(画面側)
        run: npx tsc --noEmit
      - name: Claude の相談の試験(模擬。鍵も通信も不要)
        run: node worker/test/agent_mock_test.mjs
      - name: Worker の依存を入れる
        run: npm ci
        working-directory: worker
      - name: 型の検査(Worker)
        run: npx tsc --noEmit
        working-directory: worker
      - name: 中継の試験(手元の wrangler dev と模擬の上流。鍵は不要)
        run: node worker/test/relay_test.mjs
        timeout-minutes: 5
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
