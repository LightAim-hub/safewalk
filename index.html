<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SafeWalk</title>
    <link rel="icon" href="data:," />
    <meta name="description" content="神戸市の徒歩の地図。経路ごとに交通事故の記録と夜の歩きやすさの目安を出します" />
    <!-- 書体: BIZ UDPゴシック（Morisawa / SIL OFL 1.1・fonts/OFL.txt）。自分で配信し、外へ通信しない。読み込み中は予備の書体で出す。 -->
    <style>
      @font-face { font-family: "BIZ UDPGothic"; src: url("fonts/BIZUDPGothic-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: "BIZ UDPGothic"; src: url("fonts/BIZUDPGothic-Bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
    </style>
  </head>
  <body>
    <main id="map" aria-label="神戸市の地図"></main>

    <div class="ui">
      <form id="searchbar" class="card bar" role="search" autocomplete="off">
        <div class="field grow">
          <input id="q" type="search" placeholder="神戸市内を検索（例: 三宮・kobe airport）" aria-label="場所を検索" />
        </div>
        <button id="clear-q" type="button" class="icon plain clear" aria-label="検索を消す" title="消す" hidden>✕</button>
        <button id="open-directions" type="button" class="icon" aria-label="経路を調べる" title="経路">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.7 11.3l-9-9a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4zM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.500l3.500 3.500z"/></svg>
        </button>
      </form>

      <div id="chips" class="chips" role="region" aria-label="ジャンルで探す"></div>
      <button id="research" type="button" class="research" hidden>この範囲で再検索</button>

      <form id="directions" class="card directions" autocomplete="off" aria-label="経路の入力" hidden>
        <div class="dir-top">
          <button id="dir-summary" type="button" class="dir-summary" aria-expanded="false" aria-controls="dir-fields" hidden></button>
          <button id="add-stop" type="button" class="add-stop">＋ 経由地</button>
          <div class="period" role="group" aria-label="歩く時間帯">
            <button type="button" data-period="day" aria-label="昼に歩く">昼</button>
            <button type="button" data-period="night" aria-label="夜に歩く">夜</button>
          </div>
          <button id="close-directions" type="button" class="icon plain" aria-label="経路を閉じる">✕</button>
        </div>
        <div id="dir-fields" class="dir-fields">
          <div class="field"><input id="from" placeholder="出発地（現在地も選べます）" aria-label="出発地" /></div>
          <div id="stops" class="stops"></div>
          <div class="field"><input id="to" placeholder="目的地" aria-label="目的地" /></div>
          <button id="swap" type="button" class="icon plain swap" aria-label="出発地と目的地を入れ替える">⇅</button>
        </div>
      </form>

      <div id="grip" class="grip" role="button" aria-label="パネルの高さを変える"></div>
      <section id="sheet" class="card sheet" hidden aria-label="結果"></section>
    </div>

    <button id="locate" type="button" class="locate" aria-label="現在地を表示" title="現在地">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.100A7 7 0 0 0 13 5.100V3h-2v2.100A7 7 0 0 0 5.100 11H3v2h2.100A7 7 0 0 0 11 18.900V21h2v-2.100A7 7 0 0 0 18.900 13H21v-2zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
    </button>
    <button id="menu-open" type="button" class="locate menu-btn" aria-label="メニュー" title="メニュー" aria-haspopup="dialog">≡</button>
    <section id="guide" class="card guide" aria-label="案内" hidden>
      <p id="guide-next" class="next"></p>
      <p id="guide-rest" class="rest"></p>
      <div class="guide-actions">
        <button id="guide-stop" type="button" class="secondary">案内を終わる</button>
        <button id="guide-voice" type="button" class="secondary" aria-pressed="true">音声 オン</button>
      </div>
    </section>
    <p id="announce" class="sr-only" role="status"></p>
    <p id="toast" class="toast" role="status" hidden></p>
    <div id="load-error" class="card load-error" role="alert" hidden>
      <p>読み込みに失敗しました。通信を確かめて、もう一度お試しください。</p>
      <button id="reload" type="button" class="primary">再読み込み</button>
    </div>
    <p id="loading" class="toast" role="status">地図を読み込んでいます…</p>
    <div id="load-slow" class="card load-error" hidden>
      <p>はじめての読み込みは、地図と道のデータで約7MBあります。電波の良い所では早くなります。</p>
      <button id="load-slow-reload" type="button" class="secondary">読み込み直す</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
